# Project-local Codex hook configuration.
#
# Codex will ask for hook trust before running project hooks. Inspect the
# scripts under .codex/hooks before trusting this project.

[[hooks.PreToolUse]]
matcher = ".*"
command = "python3 .codex/hooks/pre_tool_use.py"
timeout = 30

[[hooks.PostToolUse]]
matcher = ".*"
command = "python3 .codex/hooks/post_tool_use.py"
timeout = 30

[[hooks.UserPromptSubmit]]
matcher = ".*"
command = "python3 .codex/hooks/user_prompt_submit.py"
timeout = 30
